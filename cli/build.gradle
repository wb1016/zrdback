plugins {
    id 'application'
}

base {
    archivesName = 'zrdback-cli'
    version = mod_version
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':zrdback-store')
    implementation "com.google.code.gson:gson:${gson_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}

application {
    mainClass = 'space.cobaltworks.zrdback.cli.ZrdBackCli'
    applicationName = 'zrdback-cli'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}

// The default `jar` task produces a library jar without a Main-Class and
// without its dependencies, so `java -jar` cannot run it, and nothing in
// this repository consumes `:cli` as a library. Make the main jar the
// self-contained executable one instead, so the artifact is simply
// `zrdback-cli-<version>.jar`. The CLI is meant to be copied to a backup
// machine that has no Gradle or Minecraft installation.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'zrdback-cli',
            'Implementation-Version': project.version,
            // zstd-jni loads its native library from an unnamed module. JDK 24+
            // warns about that and will block it in a future release unless
            // native access is enabled; the manifest attribute does that for
            // every `java -jar` run without a command-line flag.
            'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }

    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'

    // The runtime classpath contains the project jars; bundle their built
    // outputs, so this task has to wait for them.
    dependsOn configurations.runtimeClasspath
}
