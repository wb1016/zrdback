name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Set up JDK
        uses: actions/setup-java@main
        with:
          distribution: zulu
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@main
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload the mod jar
        uses: actions/upload-artifact@main
        with:
          name: zrdback-mod
          path: mod/build/libs/*.jar

      - name: Upload the CLI
        uses: actions/upload-artifact@main
        with:
          name: zrdback-cli
          path: cli/build/libs/*.jar

  # Cross-validate the Java ZVCR-3D port against the C++ reference
  # implementation (the `zvcr` submodule). The Java writer's uncompressed
  # container must match the reference's byte for byte.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@main
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Check the reference checkout and toolchain
        run: |
          set -euo pipefail
          if [ ! -f golden-tool/zvcr/zvcr_lib/CMakeLists.txt ]; then
            echo "::error::zvcr submodule is missing (golden-tool/zvcr/zvcr_lib/CMakeLists.txt not found)"
            git submodule status || true
            exit 1
          fi
          git submodule status
          cmake --version
          "${CXX:-g++}" --version

      - name: Configure the reference tool
        run: cmake -B golden-tool/build -S golden-tool

      - name: Build the reference tool
        # Bounded on purpose: `cmake --build ... -j` with no job count hands
        # make an unlimited `-j`, which can start hundreds of compilers at
        # once and OOM the runner.
        run: cmake --build golden-tool/build --parallel 4

      - name: Generate the reference container
        run: |
          golden-tool/build/zvcr_golden gen /tmp/golden.zvcr3d
          golden-tool/build/zvcr_golden hexdump /tmp/golden.zvcr3d > /tmp/golden.hex

      - name: Compare against the committed golden file
        run: |
          diff -u zvcr-java/src/test/resources/golden/golden.hex /tmp/golden.hex

      - name: Run the Java cross-validation test
        run: ./gradlew :zvcr-java:test --console=plain

  # Server-free tests for the benchmark tooling.
  bench-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Set up uv
        uses: astral-sh/setup-uv@main

      - name: Set up the Python environment
        run: bench/setup/setup-python.sh

      - name: Self-test the world comparator
        run: bench/.venv/bin/python bench/tools/mca_integrity_selftest.py
