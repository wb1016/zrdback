name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: zrdback-mod
          path: mod/build/libs/*.jar

      - name: Upload the CLI
        uses: actions/upload-artifact@v4
        with:
          name: zrdback-cli
          path: cli/build/libs/*.jar
