# Format: name|project_id|version_id|filename|sha512
#
# Version IDs are immutable on Modrinth, so a pinned ID always resolves to
# the same file. The sha512 is verified after download.
#
# Dependency notes (verified against each jar's fabric.mod.json):
#   - fabric-api is the only external dependency. Chunky, FastBack and
#     ZRDBack all require it.
#   - c2me's `c2me-base` dependency ships *inside* the c2me jar as a nested
#     jar (META-INF/jars/c2me-fabric-base-...-all.jar), as do its other
#     libraries (caffeine, jctools, rxjava, mixinsquared).
#   - lithium requires `mixinextras >= 0.5.5`, which fabric-loader ships
#     itself (META-INF/jars/mixinextras-fabric-0.5.5.jar). It is not on
#     Modrinth and must not be downloaded separately.
#   - FastBack's `fabric-permissions-api-v0` is a nested jar inside the
#     FastBack jar.
#   - ZRDBack itself is built from this repository, not downloaded.

