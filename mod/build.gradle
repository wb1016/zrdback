plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${archives_base_name}-${mod_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation project(':zvcr-java')
    include project(':zvcr-java')
    include "com.github.luben:zstd-jni:${zstd_jni_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

processResources {
    inputs.property 'mod_version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'fabric_loader_version', fabric_loader_version
    filesMatching('fabric.mod.json') {
        expand 'mod_version': mod_version,
                'minecraft_version': minecraft_version,
                'fabric_loader_version': fabric_loader_version
    }
}

loom {
    runs {
        server {
            server()
            setConfigName('ZVCR Backup Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}
